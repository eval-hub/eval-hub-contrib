parameters:
  # ---------------------------------------------------------------------------
  # Endpoint configuration
  #
  # model.url (from the job spec) sets the base URL of the inference server.
  # Append /v1 if not already present; the adapter adds /completions or
  # /chat/completions depending on api_style.
  #
  # Endpoint examples:
  #   vLLM:       http://vllm-server:8000
  #   Ollama:     http://ollama-server:11434
  #   OpenRouter: https://openrouter.ai/api  (chat-only → set api_style=chat)
  # ---------------------------------------------------------------------------

  - name: api_key
    type: string
    default: null
    description: >
      API key for authenticated endpoints. Sets OPENAI_API_KEY in the subprocess.
      For open vLLM/Ollama endpoints without auth, this can be omitted — a
      placeholder value is used automatically. Falls back to OPENAI_API_KEY
      environment variable if not set here.

  - name: api_style
    type: string
    default: auto
    description: >
      Endpoint API style: 'auto' (default), 'completions', or 'chat'.
      'auto' detects from the resolved endpoint URL (model.url, or base_url if
      model.url is unset): openrouter.ai / groq.com / together.ai → 'chat';
      everything else → 'completions'. Any other value raises a ValueError at startup.
      'completions' selects local-completions (supports loglikelihood tasks).
      'chat' selects local-chat-completions (generation tasks only).
      Loglikelihood benchmarks (MMLU, HellaSwag, ARC, GPQA, MuSR) raise
      an error at startup when api_style resolves to 'chat'.

  # ---------------------------------------------------------------------------
  # Model / generation settings
  # ---------------------------------------------------------------------------

  - name: num_concurrent
    type: integer
    default: 4
    description: >
      Number of concurrent HTTP requests to the inference endpoint.
      Increase for high-throughput endpoints (vLLM with many GPU replicas);
      decrease if the endpoint rate-limits or has low concurrency.

  - name: max_retries
    type: integer
    default: 3
    description: Number of retries per request on transient HTTP errors.

  - name: timeout_http
    type: integer
    default: 300
    description: Per-request HTTP timeout in seconds. Increase for slow or large models.

  - name: max_context_length
    type: integer
    default: 4096
    description: >
      Maximum total context length (prompt + completion) in tokens.
      The harness uses this to truncate inputs. Without a local tokenizer
      the count is approximate; set 'tokenizer' for accurate truncation.

  - name: max_gen_tokens
    type: integer
    default: 512
    description: >
      Maximum tokens the model may generate per request.
      Increase for long-form generation tasks (math, code).

  - name: tokenizer
    type: string
    default: null
    description: >
      Optional HuggingFace model ID for accurate token counting and context
      truncation (e.g. 'meta-llama/Meta-Llama-3-8B'). When omitted, the harness
      uses character-count heuristics — sufficient for most short-answer tasks
      but imprecise for long-context benchmarks. A warning is logged when this
      is not set. The tokenizer is loaded from the HuggingFace Hub; set
      HF_TOKEN in the environment if the model is gated.

  - name: tokenizer_backend
    type: string
    default: "None"
    description: >
      Tokenizer backend used by the harness: 'None' (default, send raw strings),
      'huggingface' (requires 'tokenizer'), 'tiktoken', or 'auto' (probes the
      endpoint's /tokenize API). 'None' is correct for all OpenAI-compatible
      endpoints; only change this if the endpoint exposes a /tokenize path.

  - name: batch_size
    type: integer
    default: 1
    description: >
      Number of requests sent per batch. For API endpoints this is typically 1
      (the server handles batching internally). Increase only if the endpoint
      explicitly supports batched completions requests.

  - name: gen_kwargs
    type: string
    default: null
    description: >
      Comma-separated generation kwargs forwarded to the API payload, overriding
      task YAML defaults. Format: 'key=value,key=value'.
      Examples: 'temperature=0.0,do_sample=False'
                'temperature=0.6,top_p=0.9,do_sample=True'
      Keys must match the OpenAI completions request body (temperature, top_p,
      top_k, repetition_penalty, stop, seed, etc.).

  - name: apply_chat_template
    type: boolean
    default: false
    description: >
      Apply the model's chat template to prompts before sending. Required for
      instruction-tuned models accessed via local-chat-completions. Set to true
      when api_style=chat or when using a chat endpoint with instruction models.

  - name: system_instruction
    type: string
    default: null
    description: >
      System prompt prepended to every request. Useful for instruction-tuned
      models that expect a system role (e.g. 'You are a helpful assistant.').

  # ---------------------------------------------------------------------------
  # Evaluation settings
  # ---------------------------------------------------------------------------

  - name: num_fewshot
    type: integer
    default: null
    description: >
      Override the number of few-shot examples. When null (default), each task
      uses its built-in default (e.g. 5-shot for MMLU, 0-shot for HellaSwag).
      Set to 0 for zero-shot evaluation across all tasks.

  # ---------------------------------------------------------------------------
  # Custom tasks
  # ---------------------------------------------------------------------------

  - name: task
    type: string
    default: null
    description: >
      Required for lm-eval/custom. One or more lm-eval task names, comma-
      separated (e.g. 'wikitext', 'lambada_openai,crows_pairs_english').
      Also accepts full task YAML paths or lm-eval group/tag names.
      Ignored for all built-in benchmark IDs.

  - name: custom_tasks_path
    type: string
    default: null
    description: >
      Path to a directory containing custom task YAML files (passed as
      --include_path to lm_eval). Mount the directory into the container at a
      known path (e.g. /data/tasks) and set this parameter to that path.
      Custom tasks in this directory are addressable by their 'task:' YAML key.

  # ---------------------------------------------------------------------------
  # Dataset source
  # ---------------------------------------------------------------------------

  - name: dataset_source
    type: string
    default: hub
    description: >
      Where to load evaluation datasets from:
        'hub'   — HuggingFace Hub (default; uses HF cache, respects HF_TOKEN).
        'local' — local filesystem; set dataset path in custom task YAML's
                  dataset_kwargs.data_dir pointing to a mounted volume.
        's3'    — S3-compatible storage; set s3_endpoint + AWS credentials
                  and reference s3:// URIs in dataset_kwargs.data_files.
      For built-in tasks (MMLU, etc.) the dataset path is baked in; only
      'hub' is applicable. Use 'local' or 's3' with lm-eval/custom tasks.

  - name: hf_datasets_cache
    type: string
    default: null
    description: >
      Override the HuggingFace datasets cache directory (HF_DATASETS_CACHE).
      Mount a PVC at this path to reuse downloaded datasets across runs and
      avoid re-downloading on every job execution.

  - name: allow_code_execution
    type: boolean
    default: false
    description: >
      Permit benchmarks that execute model-generated Python (humaneval,
      humaneval_instruct, mbpp). Off by default: those benchmarks are refused at
      startup. When true, the code runs inside the adapter pod, so rely on the
      pod's isolation (non-root, no extra privileges) and a NetworkPolicy.
      Mirrors LMEvalJob's allowCodeExecution.

  - name: trust_remote_code
    type: boolean
    default: false
    description: >
      Pass --trust_remote_code to lm-eval so datasets that ship a loading script
      on the Hugging Face Hub (e.g. pile_*, cmmlu_*, aclue_*, qasper, ethics_cm)
      can load. Off by default; enable only for datasets you trust.
      Mirrors LMEvalJob's allowOnline/trustRemoteCode behaviour.

  - name: s3_endpoint
    type: string
    default: null
    description: >
      S3-compatible endpoint URL for dataset_source=s3.
      Example: 'https://s3.us-east-1.amazonaws.com' or 'http://minio:9000'.

  - name: aws_access_key_id
    type: string
    default: null
    description: AWS / S3-compatible access key ID for dataset_source=s3.

  - name: aws_secret_access_key
    type: string
    default: null
    description: AWS / S3-compatible secret access key for dataset_source=s3.

  # ---------------------------------------------------------------------------
  # Runtime
  # ---------------------------------------------------------------------------

  - name: subprocess_timeout
    type: integer
    default: 7200
    description: >
      Maximum wall-clock time (seconds) for the lm_eval subprocess before the
      adapter kills it and reports failure. Default 2 hours. Increase for large
      benchmark suites (full MMLU) or slow endpoints.

  - name: log_level
    type: string
    default: INFO
    description: Logging verbosity for the adapter process (DEBUG, INFO, WARNING, ERROR).

  - name: languages
    type: array
    default: [en]
    description: ISO 639 language codes for EvalCard metadata.

  - name: languages_count
    type: integer
    default: 1
    description: Number of languages evaluated, for EvalCard metadata.

  - name: base_url
    type: string
    default: null
    description: >
      Fallback base URL for the inference endpoint when model.url is not set in
      the job spec. Identical semantics to model.url — provide one or the other,
      not both. Example: 'http://vllm-server:8000'.

  - name: mlflow_experiment_name
    type: string
    default: null
    description: >
      Fallback MLflow experiment name when JobSpec.experiment_name is unset.
      MLflow logging is skipped unless at least one of these is configured.
