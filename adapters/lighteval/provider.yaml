# LightEval Adapter — Provider Configuration
#
# Wraps HuggingFace LightEval (https://github.com/huggingface/lighteval) as an
# EvalHub community provider. Evaluates any OpenAI-compatible inference endpoint
# against the benchmark suite without loading model weights locally.

id: lighteval
name: LightEval
description: >
  HuggingFace LightEval — endpoint-only evaluation against any OpenAI-compatible
  server (vLLM, Ollama, OpenRouter). Supports loglikelihood (multiple-choice) and
  generative tasks across reasoning, math, knowledge, coding, and safety benchmarks.
  Loglikelihood scoring uses the /v1/completions echo+logprobs path; no local
  model weights required.
type: community

# ── Agent Discoverability ──────────────────────────────────────────────────────
agent:
  evaluates:
    - accuracy
    - reasoning
    - math
    - knowledge
    - coding
    - safety
    - truthfulness
  recommended_when:
    - "User wants GSM8K, HellaSwag, ARC, WinoGrande, or TruthfulQA via endpoint"
    - "Competition math benchmarks: AIME 2024/2025, MATH-500"
    - "User wants GLUE language-understanding subtasks via a custom endpoint"
    - "Lightweight truth-checking: TruthfulQA MC against an API model"
  target_type: model
  summary: >-
    HuggingFace LightEval — 28 benchmarks across reasoning, math, knowledge, coding,
    and safety. Evaluates any OpenAI-compatible endpoint; no local GPU needed.
  complements:
    - inspect
    - lm-eval
  hints:
    - >-
      Pass max_samples in benchmark parameters to limit dataset size (e.g.
      {"max_samples": 50}). Without it the full dataset runs, which can take
      hours for large benchmarks.
    - >-
      Log-likelihood benchmarks (arc:easy, arc:challenge, winogrande, glue:cola,
      glue:sst2, glue:mrpc, truthfulqa:mc and the suites that include them:
      commonsense_reasoning, scientific_reasoning, language_understanding,
      truthfulness) are scored through /v1/completions with echo=True and
      logprobs=1. The endpoint must support these parameters (vLLM does by
      default); a request that cannot be scored fails the job instead of
      producing an accuracy. If your endpoint does not expose them, use
      lm-evaluation-harness instead.
    - >-
      The scored text is the one lighteval's own backends use: system prompt,
      task instruction, few-shot examples (num_few_shot) and the question, then
      each answer choice. Per-choice log-likelihoods match lighteval's
      transformers backend for the same model and prompt settings.
    - >-
      Generation-only benchmarks (gsm8k, math*, aime*, gpqa:diamond, hellaswag,
      piqa, openbookqa, mmlu, triviaqa, truthfulqa:gen, lcb:codegeneration_v6)
      do not need /v1/completions logprobs.

parameters:
  - name: provider
    type: string
    default: endpoint
    description: >
      Model provider backend. Use "endpoint" (default) for any OpenAI-compatible
      API server (vLLM, Ollama, OpenRouter, etc.). Other valid values are
      "transformers", "vllm", "openai", "anthropic". "anthropic" runs the
      generation-only benchmarks; log-likelihood benchmarks are rejected for it
      because they need /v1/completions with echo+logprobs, which Anthropic's API
      does not implement.

  - name: max_samples
    type: integer
    default: null
    description: >
      Maximum number of examples to evaluate per task. When omitted the full
      dataset runs, which can take hours for large benchmarks.

  - name: num_few_shot
    type: integer
    default: 0
    description: Number of few-shot examples prepended to each prompt (0 = zero-shot).

  - name: random_seed
    type: integer
    default: 42
    description: Random seed for reproducible sampling.

  - name: generation_parameters
    type: object
    default: null
    description: >
      Generation config forwarded to the model (temperature, max_new_tokens,
      top_p, top_k, stop_tokens, etc.). Passed as lighteval brace notation.

runtime:
  k8s:
    image: quay.io/evalhub/community-lighteval:latest
    entrypoint:
      - python
      - main.py
    cpu_request: 500m
    memory_request: 512Mi
    cpu_limit: 2000m
    memory_limit: 4Gi
  local:
    command: python main.py

benchmarks:
  # ── Math ──────────────────────────────────────────────────────────────────
  - id: math
    name: Math problem-solving suite
    description: >
      Mathematical problem-solving suite covering GSM8K, algebra,
      counting & probability, and MATH-500 competition problems.
    category: math
    metrics: [extractive_match]
    tags: [math, reasoning, lighteval]
    primary_score:
      metric: extractive_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.3

  - id: gsm8k
    name: GSM8K
    description: Grade-school math word problems requiring multi-step reasoning (8,500 problems).
    category: math
    metrics: [gsm8k.extractive_match]
    tags: [math, reasoning, lighteval]
    primary_score:
      metric: gsm8k.extractive_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.5

  - id: math:algebra
    name: Competition algebra
    description: Algebra subset of MATH competition benchmark.
    category: math
    metrics: [extractive_match]
    tags: [math, competition, lighteval]
    primary_score:
      metric: extractive_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.3

  - id: math:counting_and_probability
    name: Counting & probability problems
    description: Counting and probability subset of MATH competition benchmark.
    category: math
    metrics: [extractive_match]
    tags: [math, competition, lighteval]
    primary_score:
      metric: extractive_match
      lower_is_better: false
    pass_criteria:
      threshold: 0.3

  - id: math_500
    name: MATH-500
    description: 500 competition math problems across all MATH difficulty levels.
    category: math
    metrics: [math_500.pass@1]
    tags: [math, competition, lighteval]
    primary_score:
      metric: math_500.pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.3

  - id: aime24
    name: AIME 2024
    description: American Invitational Mathematics Examination 2024 — 30 competition problems.
    category: math
    metrics: [aime24.pass@1, aime24.avg@n:n=1]
    tags: [math, competition, aime, lighteval]
    primary_score:
      metric: aime24.pass@1
      lower_is_better: false
    pass_criteria:
      threshold: 0.0

  - id: aime25
    name: AIME 2025
    description: American Invitational Mathematics Examination 2025 — 30 competition problems.
    category: math
    metrics: [aime25.pass@1, aime25.avg@n:n=1]
    tags: [math, competition, aime, lighteval]
    primary_score:
