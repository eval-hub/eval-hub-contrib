name: Regen inspect constraints

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Require PYTHON_INDEX
        env:
          PYTHON_INDEX: ${{ secrets.PYTHON_INDEX }}
        run: |
          if [ -z "$PYTHON_INDEX" ]; then
            echo "::error::PYTHON_INDEX is not set"
            exit 1
          fi
          echo "UV_INDEX_URL=$PYTHON_INDEX" >> "$GITHUB_ENV"
      - name: Regenerate constraints
        working-directory: adapters/inspect
        run: |
          set -euo pipefail
          { echo "# Transitive dependency pins for the Inspect adapter image, applied with: pip install -r requirements.txt -c constraints.txt"
            echo "# Generated; do not edit by hand. Regenerate (and re-audit) with the command in README.md → Updating dependencies."
            uv pip compile requirements.txt --universal --python-version 3.12 --no-header --no-annotate --index-url "$UV_INDEX_URL" | grep -v " @ git"
          } > constraints.txt
          echo "--- pins of interest ---"
          grep -E '^(fsspec|s3fs|multiprocess|inspect-scout|inspect-ai|aiobotocore)==' constraints.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: inspect-constraints
          path: adapters/inspect/constraints.txt
