name: Test promptfoo

on:
  push:
    branches: [main]
    paths:
      - 'adapters/promptfoo/**'
      - '.github/workflows/test-promptfoo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/promptfoo/**'
      - '.github/workflows/test-promptfoo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: adapters/promptfoo
        run: uv pip install --system -r requirements.txt -r requirements-test.txt
      - name: Run tests
        working-directory: adapters/promptfoo
        run: pytest tests/ -v
