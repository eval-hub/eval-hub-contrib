name: Test IFBench

on:
  push:
    branches: [main]
    paths: ['adapters/ifbench/**']
  pull_request:
    branches: [main]
    paths: ['adapters/ifbench/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: adapters/ifbench
        run: uv pip install --system -r requirements.txt -r requirements-test.txt
      - name: Run tests
        working-directory: adapters/ifbench
        run: pytest tests/ -v
      - name: Verify offline non-root container runtime
        run: |
          docker build -t ifbench-container-test -f adapters/ifbench/Containerfile adapters/ifbench
          for runtime_user in 1001 1001230000:0; do
            docker run --rm --network=none --read-only --user "$runtime_user" \
              --tmpfs /tmp -e PYTHONDONTWRITEBYTECODE=1 \
              -v "$PWD/adapters/ifbench/tests:/tests:ro" \
              --entrypoint python ifbench-container-test /tests/container_smoke.py
          done
