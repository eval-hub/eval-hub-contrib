name: Push RULER image

on:
  push:
    branches: [main, 'v*']
    paths: ['adapters/ruler/**']
  workflow_dispatch:

env:
  REGISTRY: quay.io/evalhub
  IMAGE_NAME: community-ruler

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          CHANNEL: ${{ steps.tag.outputs.channel }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            -f adapters/ruler/Containerfile \
            -t "${REGISTRY}/${IMAGE_NAME}:${GIT_SHA}" \
            -t "${REGISTRY}/${IMAGE_NAME}:${CHANNEL}" \
            adapters/ruler

      - name: Push image
        env:
          CHANNEL: ${{ steps.tag.outputs.channel }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin
          docker push "${REGISTRY}/${IMAGE_NAME}:${GIT_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${CHANNEL}"
