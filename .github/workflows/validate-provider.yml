name: Validate provider.yaml

on:
  pull_request:
    branches: [main]
    paths: ['adapters/**']

jobs:
  validate-provider-yaml:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: uv pip install --system pyyaml==6.0.2

      - name: Validate provider.yaml for new adapters
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/validate_provider.py
