name: Test Inspect AI

on:
  push:
    branches: [main]
    paths: ['adapters/inspect/**']
  pull_request:
    branches: [main]
    paths: ['adapters/inspect/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate container constraints
        working-directory: adapters/inspect
        run: |
          uv pip compile requirements.txt \
            --constraint constraints.txt \
            --universal \
            --python-version 3.12 \
            --no-header \
            --no-annotate \
            --quiet \
            --output-file "$RUNNER_TEMP/inspect-constraints-check.txt"
      - name: Install test dependencies
        working-directory: adapters/inspect
        run: |
          SDK_DEP=$(grep 'eval-hub-sdk' requirements.txt)
          uv pip install --system "$SDK_DEP" -r requirements-test.txt
      - name: Run tests
        working-directory: adapters/inspect
        run: pytest tests/ -v
