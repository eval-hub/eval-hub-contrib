name: Build and push adapter images

on:
  push:
    branches: [main, 'v*']
    paths: ['adapters/**']
  workflow_dispatch:
    inputs:
      adapter:
        description: 'Adapter to build (leave empty for change-detection). tooleval or toolbench-server builds both.'
        required: false
        type: string

env:
  REGISTRY: quay.io/evalhub

jobs:
  detect:
    if: github.repository == 'eval-hub/eval-hub-contrib'
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.find.outputs.adapters }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: find
        run: |
          # ToolEval adapter + cache-only tool server are paired images.
          expand_tooleval_pair() {
            local list="$1"
            if echo "$list" | grep -qE '(^| )(tooleval|toolbench-server)( |$)'; then
              echo "$list" | tr ' ' '\n' | grep -vE '^(tooleval|toolbench-server)$' | grep -v '^$'
              echo tooleval
              echo toolbench-server
            else
              echo "$list" | tr ' ' '\n' | grep -v '^$'
            fi
          }

          if [[ -n "${{ inputs.adapter }}" ]]; then
            adapters=$(expand_tooleval_pair "${{ inputs.adapter }}" \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            changed=$(git diff --name-only HEAD~1 HEAD \
              | grep '^adapters/' \
              | cut -d/ -f2 \
              | sort -u \
              | while read -r dir; do
                  if [[ "$dir" == "tooleval" ]]; then
                    # Any change under adapters/tooleval/ (adapter or tool-server).
                    echo tooleval
                    echo toolbench-server
                  elif [ -f "adapters/${dir}/Containerfile" ]; then
                    echo "$dir"
                  fi
                done \
              | sort -u)
            adapters=$(printf '%s\n' "$changed" \
              | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "adapters=${adapters}" >> "$GITHUB_OUTPUT"
          echo "Will build: ${adapters}"

  build:
    needs: detect
    if: github.repository == 'eval-hub/eval-hub-contrib' && needs.detect.outputs.adapters != '[]'
    runs-on: ubuntu-latest
    concurrency:
      group: push-${{ matrix.adapter }}-${{ github.ref_name }}
      cancel-in-progress: false
    strategy:
      matrix:
        adapter: ${{ fromJson(needs.detect.outputs.adapters) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name and tag
        id: image
        env:
          ADAPTER: ${{ matrix.adapter }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Validate adapter name: directory names are lowercase letters, digits, and hyphens only.
          if [[ ! "$ADAPTER" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid adapter name: '${ADAPTER}'" >&2
            exit 1
          fi
          # Mapping of adapter directory name -> image name suffix.
          # Omit an entry to default to community-<adapter>.
          declare -A IMAGE_MAP=(
            [clear]=ibm-clear
          )
          suffix="${IMAGE_MAP[$ADAPTER]:-$ADAPTER}"
          echo "name=community-${suffix}" >> "$GITHUB_OUTPUT"
          # main -> latest; v* branches -> branch name (e.g. v0.5)
          if [[ "$BRANCH" == "main" ]]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=${BRANCH}" >> "$GITHUB_OUTPUT"
          fi
          # toolbench-server lives under adapters/tooleval/tool-server/
          if [[ "$ADAPTER" == "toolbench-server" ]]; then
            echo "context=adapters/tooleval/tool-server" >> "$GITHUB_OUTPUT"
          else
            echo "context=adapters/${ADAPTER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          ADAPTER: ${{ matrix.adapter }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          CHANNEL: ${{ steps.image.outputs.channel }}
          CONTEXT: ${{ steps.image.outputs.context }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build \
            -f "${CONTEXT}/Containerfile" \
            -t "${REGISTRY}/${IMAGE_NAME}:${GIT_SHA}" \
            -t "${REGISTRY}/${IMAGE_NAME}:${CHANNEL}" \
            "${CONTEXT}"

      - name: Push image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          CHANNEL: ${{ steps.image.outputs.channel }}
          GIT_SHA: ${{ github.sha }}
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin
          docker push "${REGISTRY}/${IMAGE_NAME}:${GIT_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${CHANNEL}"
