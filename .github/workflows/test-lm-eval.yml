name: Test LM Evaluation Harness

on:
  push:
    branches: [main]
    paths:
      - 'adapters/lm-eval/**'
      - 'Makefile'
      - '.github/workflows/test-lm-eval.yml'
  pull_request:
    branches: [main]
    paths:
      - 'adapters/lm-eval/**'
      - 'Makefile'
      - '.github/workflows/test-lm-eval.yml'
  workflow_dispatch:

jobs:
  # ── Integration tests (fully mocked — no lm_eval install required) ──────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        working-directory: adapters/lm-eval
        run: |
          SDK_DEP=$(grep 'eval-hub-sdk' requirements.txt)
          uv pip install --system "$SDK_DEP" -r requirements-test.txt

      - name: Run unit tests
        working-directory: adapters/lm-eval
        run: pytest tests/ -v -m "not integration and not local and not lmeval"

      - name: Run integration tests
        working-directory: adapters/lm-eval
        run: pytest tests/ -v -m "integration and not lmeval"

  # ── Registry and manifest checks against the real, pinned lm_eval ───────────
  # The generated benchmark table (_benchmarks.py), the composite suites and the
  # chat-template tests all read lm_eval's own task configs and tokenizer path, so
  # they need the full requirements.txt. LMEVAL_REQUIRED turns a missing install
  # into a failure instead of a skip, so this check cannot go green by skipping.
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LMEVAL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install adapter and test dependencies
        working-directory: adapters/lm-eval
        run: uv pip install --system -r requirements.txt -r requirements-test.txt

      - name: Benchmark table is current
        working-directory: adapters/lm-eval
        run: python scripts/generate_benchmarks.py --check

      - name: Run registry, manifest and chat-template tests
        working-directory: adapters/lm-eval
        run: pytest tests/ -v -m lmeval

  # ── Live endpoint tests (Ollama, vLLM) ────────────────────────────────────────
  # Placeholder: these jobs require a tests/test_local_openai.py file with
  # @pytest.mark.local + @pytest.mark.openai_endpoint markers (see the lighteval
  # and guidellm adapters for the reference implementation). They will be added
  # in a follow-up PR once the live endpoint test suite is written.
  # test-local-ollama and test-local-vllm-cpu are intentionally absent here.
