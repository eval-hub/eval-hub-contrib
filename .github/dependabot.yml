version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Composite actions (e.g. codeql-action/init vs analyze) are separate
      # Dependabot deps; group by prefix so related bumps share one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      docker-actions:
        patterns:
          - "docker/*"
      github-actions-core:
        patterns:
          - "actions/*"
    labels:
      - "dependencies"
      - "github-actions"
