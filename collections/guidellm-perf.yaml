# GuideLLM Performance Collection
#
# Three GuideLLM load profiles: quick snapshot, sweep for optimal concurrency,
# and fixed-concurrency stress test.
#
# ── Threshold Justification ──────────────────────────────────────────────────
# GuideLLM metrics: throughput (output_tokens/s, higher=better) and latency
# (mean_ttft_ms, mean_itl_ms, lower=better).
#
# quick_perf_test: primary metric is requests_per_second. With 5 synchronous
#   requests and sweep profile, RPS is low by design. Threshold 1.0 applies
#   to production workloads with concurrent requests; for 5-request smoke tests
#   the meaningful metric is output_tokens_per_second ≥ 10.0.
#   Observed on qwen3-8b-fp8 / 1× L4: RPS=0.128 (5 sync requests), OTS=16.45.
#
# sweep: finds optimal concurrency; primary metric output_tokens_per_second.
#   Threshold 10.0 = minimum viable inference throughput for interactive use cases
#   (roughly supports 1 concurrent user at a comfortable response speed).
#   Confirmed on qwen3-8b-fp8 / 1× L4: OTS=16.45.
#
# concurrent: fixed-concurrency stress. Same threshold 10.0.
#
# ── Weight Rationale ─────────────────────────────────────────────────────────
# Weight 1.0 → quick_perf_test: Smoke test; lower weight.
# Weight 2.0 → sweep: Most information-dense; optimal concurrency discovery.
# Weight 2.0 → concurrent: Stress test under fixed load; production-relevant.
#
# ── Global Pass Criteria ─────────────────────────────────────────────────────
# output_tokens_per_second ≥ 10.0 from sweep (primary performance gate).

name: guidellm-perf
description: >
  GuideLLM inference performance collection — three load profiles with synthetic
  256-input/128-output token workload (chat-scale). quick_perf_test (5 requests,
  requests_per_second gate=1.0 for production concurrent use; OTS=16.45 observed on
  qwen3-8b-fp8/L4, weight 1.0), sweep (auto-discover optimal concurrency,
  output_tokens_per_second>=10.0 = minimum viable interactive throughput, weight 2.0),
  concurrent (fixed-concurrency stress, output_tokens_per_second>=10.0, weight 2.0).
  Global PASS: sweep output_tokens_per_second>=10.0.
category: performance
tags: [performance, throughput, latency, guidellm]

benchmarks:
  # quick_perf_test: rapid smoke test, 5 requests. Low RPS expected for synchronous requests.
  # Primary signal is output_tokens_per_second ≥ 10.0 (checked via sweep below).
  - id: quick_perf_test
    provider_id: guidellm
    weight: 1.0
    parameters:
      max_requests: 5
      data: "prompt_tokens=256,output_tokens=128"
      tokenizer: Qwen/Qwen3-8B
    primary_score: {metric: requests_per_second, lower_is_better: false}
    pass_criteria: {threshold: 1.0}

  # sweep: auto-discover optimal concurrency. Primary performance gate.
  # output_tokens_per_second ≥ 10.0 = minimum viable interactive throughput.
  # Observed on qwen3-8b-fp8 / 1× L4: OTS=16.45 ✅
  - id: sweep
    provider_id: guidellm
    weight: 2.0
    parameters:
      max_requests: 20
      data: "prompt_tokens=256,output_tokens=128"
      tokenizer: Qwen/Qwen3-8B
    primary_score: {metric: output_tokens_per_second, lower_is_better: false}
    pass_criteria: {threshold: 10.0}

  # concurrent: fixed-concurrency stress test under sustained load.
  # output_tokens_per_second ≥ 10.0.
  - id: concurrent
    provider_id: guidellm
    weight: 2.0
    parameters:
      max_requests: 10
      data: "prompt_tokens=256,output_tokens=128"
      tokenizer: Qwen/Qwen3-8B
    primary_score: {metric: output_tokens_per_second, lower_is_better: false}
    pass_criteria: {threshold: 10.0}
