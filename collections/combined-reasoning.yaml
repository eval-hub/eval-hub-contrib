# Combined Reasoning Collection
#
# Merges inspect-reasoning + lighteval-reasoning + lighteval-math.
# Deduplication: lighteval/gsm8k dropped (logprob issues in standard image;
# inspect/gsm8k is confirmed working and provides identical coverage).
# lighteval/math (full dataset) dropped in favour of the curated subsets
# math_500, math:algebra, math:counting_and_probability to reduce redundancy
# and runtime while preserving domain coverage.
#
# Benchmark source notes:
#   inspect provider: gsm8k, bbh, hellaswag, winogrande (all confirmed working)
#   lighteval provider: aime24, aime25 (generative, confirmed working)
#                       math_500, math:algebra, math:counting_and_probability
#                       (generative/exact-match, work with standard lighteval image)
#
# ── Threshold Justification ──────────────────────────────────────────────────
#
# Thresholds are set at the LOWER BOUND of top-10 open-weight models < 80B as
# observed on the Open LLM Leaderboard v2 (HuggingFace, accessed 2026-08).
# The "minimum" threshold marks the boundary between "capable" (competitive
# with top-10) and "insufficient for production deployment" rather than the
# median or top-1 score. This is intentional: we want a gate that rules out
# genuinely incapable models while remaining achievable for well-tuned 8B models.
#
#   GSM8K:         Cobbe et al. 2021. Top-10 < 80B range: 90–96%.
#                  Typical 8B (Qwen3-8B, Llama-3.1-8B-Instruct): 77–91%.
#                  Threshold 0.70 = Open LLM Leaderboard v2 recommended minimum;
#                  below this, math reasoning is considered insufficient.
#
#   BBH:           Suzgun et al. 2023. Top-10 < 80B range: 60–88%.
#                  Typical 8B instruction model: 60–72%.
#                  Threshold 0.50 = bottom of 8B competitive range; CoT is not
#                  forced in our eval so absolute scores are lower than leaderboard.
#
#   HellaSwag:     Zellers et al. 2019. Near-saturated benchmark.
#                  Top-10 < 80B: 83–92%. Threshold 0.80 = below typical 8B floor;
#                  any capable instruction model should clear this easily.
#                  Weight 1.0 (low) because saturation reduces discriminating power.
#
#   WinoGrande:    Sakaguchi et al. 2021. Top-10 < 80B: 80–90%.
#                  Typical 8B: 73–82%. Threshold 0.65 = lower bound of 8B range
#                  per llm-stats.com leaderboard data; random baseline = 50%.
#
#   AIME 2024/25:  AMC/AIME competition math. Top reasoning <80B: 30–70%
#                  (AIME24), 15–55% (AIME25); standard instruction <80B: 5–25%.
#                  Reasoning-tuned 8B (DeepSeek-R1-distill): up to 25–43%.
#                  Contamination note: AIME24 scores may be inflated 10–20 pts.
#                  Threshold 0.10 (~1.5 problems) = attainable floor for any
#                  model with basic competition-math capability, below which
#                  competition reasoning is absent. Weight 1.5.
#
#   MATH-500:      Lightman et al. 2023 "Let's Verify Step by Step".
#                  Top-10 < 80B: 84–97% (saturating for 70B+); typical 8B: 50–87%.
#                  Threshold 0.50 = lower bound of competitive 8B range per
#                  Open LLM Leaderboard v2. Weight 2.0: broadest competition math.
#
#   MATH:algebra:  Easiest MATH category. Top-10 < 80B: 65–92%.
#                  Threshold 0.60 = strong signal for basic symbolic reasoning.
#
#   MATH:counting: Harder MATH category (probability + combinatorics).
#                  Top-10 < 80B: 72–92%. Typical 8B: 48–75%. Threshold 0.45
#                  per leaderboard lower bound for competitive 8B models.
#
# ── Weight Rationale ─────────────────────────────────────────────────────────
#
#   Weight 2.0 → gsm8k, bbh, math_500: Primary signals with highest coverage
#                and best calibration across capability levels.
#   Weight 1.5 → aime24, aime25, math:algebra, math:counting:
#                High discriminating power between good and excellent models.
#   Weight 1.0 → hellaswag, winogrande: Near-saturated or secondary signals;
#                included for breadth but down-weighted to limit their influence
#                on the collection aggregate.
#
# ── Global Pass Criteria ─────────────────────────────────────────────────────
#
# Collection PASS requires ALL THREE mandatory benchmarks to pass:
#   (1) inspect/gsm8k ≥ 0.70   — basic math reasoning gate
#   (2) inspect/bbh ≥ 0.50     — multi-step reasoning gate
#   (3) math_500 ≥ 0.50        — competition math gate
# Plus AT LEAST 3 of the remaining 6 benchmarks must pass their thresholds.
# Rationale: a model that fails all three mandatory gates is not suitable for
# deployment in reasoning-heavy tasks regardless of commonsense scores.
#
# Usage:
#   evalhub collections create --file collections/combined-reasoning.yaml
#   evalhub collections run combined-reasoning \
#     --model-url http://qwen3-8b-fp8-predictor.project1.svc.cluster.local:8080/v1 \
#     --model-name qwen3-8b-fp8

name: combined-reasoning
description: >
  Comprehensive reasoning suite combining inspect-reasoning and lighteval math.
  Nine benchmarks across four dimensions: (1) grade-school math (GSM8K, Cobbe et
  al. 2021, threshold 0.70 = leaderboard lower bound, weight 2.0 — primary gate);
  (2) multi-step reasoning (BBH, Suzgun et al. 2023, threshold 0.50, weight 2.0);
  (3) commonsense NLI (HellaSwag threshold 0.80 / WinoGrande threshold 0.65,
  weight 1.0 each — near-saturated, down-weighted); (4) competition math (AIME24/25
  threshold 0.10, weight 1.5 — AIME24 contamination risk noted; MATH-500 threshold
  0.50 = lower bound competitive 8B, Lightman et al. 2023, weight 2.0; algebra 0.60;
  counting 0.45). Global PASS: gsm8k>=0.70 AND bbh>=0.50 AND math_500>=0.50 plus
  >=3 of remaining 6. Full threshold justification in YAML comments.
category: reasoning
tags:
  - reasoning
  - math
  - competition
  - commonsense
  - inspect
  - lighteval
  - gsm8k
  - bbh
  - aime

benchmarks:
  # ── Primary math reasoning (inspect, confirmed working) ──────────────────
  # GSM8K: 8.5K grade-school word problems. Primary math gate.
  # Top-10 <80B: 90–96%. Typical 8B: 77–91%. Threshold 0.70 per leaderboard.
  - id: inspect/gsm8k
    provider_id: inspect
    weight: 2.0
    parameters:
      max_samples: 100
    primary_score:
      metric: match/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.70

  # BIG-Bench Hard: 23 hard reasoning tasks requiring multi-step chains.
  # Top-10 <80B: 60–88%. Threshold 0.50 = bottom of competitive 8B range.
  - id: inspect/bbh
    provider_id: inspect
    weight: 2.0
    parameters:
      max_samples: 100
    primary_score:
      metric: bbh_scorer/all
      lower_is_better: false
    pass_criteria:
      threshold: 0.50

  # ── Commonsense NLI (inspect, confirmed working; down-weighted) ──────────
  # HellaSwag: Near-saturated for instruction-tuned models (SOTA 92%+ for >7B).
  # Top-10 <80B: 83–92%. Threshold 0.80. Weight 1.0: limited discriminating power.
  - id: inspect/hellaswag
    provider_id: inspect
    weight: 1.0
    parameters:
      max_samples: 100
    primary_score:
      metric: choice/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.80

  # WinoGrande: Winograd schema commonsense. Top-10 <80B: 80–90%. Typical 8B: 73–82%.
  # Threshold 0.65 per llm-stats.com lower bound. Weight 1.0: secondary signal.
  - id: inspect/winogrande
    provider_id: inspect
    weight: 1.0
    parameters:
      max_samples: 100
    primary_score:
      metric: choice/accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.65

  # ── Competition math (lighteval, generative scoring, confirmed working) ───
  # AIME 2024: 15 AMC competition problems. Top reasoning <80B: 5–37%.
  # Standard instruction <80B: 5–15%. Threshold 0.07 ≈ 1 problem correct.
  # Weight 1.5: extremely high discriminating power despite low absolute threshold.
  # AIME 2024: 30 problems total — no max_samples needed (full dataset = 30).
  - id: aime24
    provider_id: lighteval
    weight: 1.5
    parameters:
      max_samples: 30
    primary_score:
      metric: aime24|0.pass@k:k=1
      lower_is_better: false
    pass_criteria:
      threshold: 0.10

  # AIME 2025: 30 problems total. Post-cutoff, lower contamination risk.
  - id: aime25
    provider_id: lighteval
    weight: 1.5
    parameters:
      max_samples: 30
    primary_score:
      metric: aime25|0.pass@k:k=1
      lower_is_better: false
    pass_criteria:
      threshold: 0.10

  # MATH-500: 500-problem representative subset (Lightman et al. 2023).
  # max_samples: 100 → 20% sample, good statistical reliability, controls runtime.
  # Without max_samples, all 500 run (~45-90 min on L4 per collection run).
  - id: math_500
    provider_id: lighteval
    weight: 2.0
    parameters:
      max_samples: 100
    primary_score:
      metric: accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.50

  # MATH:algebra — Easiest MATH category. Full dataset is hundreds of problems.
  # max_samples: 50 for controlled runtime while preserving statistical signal.
  - id: math:algebra
    provider_id: lighteval
    weight: 1.5
    parameters:
      max_samples: 50
    primary_score:
      metric: accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.60

  # MATH:counting_and_probability — Harder MATH category (combinatorics, probability).
  # max_samples: 50 consistent with math:algebra.
  - id: math:counting_and_probability
    provider_id: lighteval
    weight: 1.5
    parameters:
      max_samples: 50
    primary_score:
      metric: accuracy
      lower_is_better: false
    pass_criteria:
      threshold: 0.45
