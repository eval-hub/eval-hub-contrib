# Lighteval — Code Collection
#
# LiveCodeBench v6 — competitive programming, contamination-free rolling benchmark.
# Generative scoring — works with standard lighteval image.
#
# ── Threshold Justification ──────────────────────────────────────────────────
# LiveCodeBench v6 (Jain et al. 2024): Samples problems from Codeforces, LeetCode,
#   and AtCoder after model training cutoff — eliminates data contamination risk.
#   codegen_pass@1 with 16 random seeds (robust estimate).
#   Top-10 <80B: 40–75%. Typical 8B: 18–40%.
#   Threshold 0.20 = bottom of competitive 8B range per artificialanalysis.ai leaderboard.
#   Weight 2.0 — highest discriminating power across the coding benchmark landscape;
#   far from saturated for <80B models; contamination-free.
#   score=0 expected for Qwen3-8B-FP8 in standard mode (LCB requires strong coding).
#
# ── Global Pass Criteria ─────────────────────────────────────────────────────
# lcb:codegeneration_v6 ≥ 0.20.

name: lighteval-code
