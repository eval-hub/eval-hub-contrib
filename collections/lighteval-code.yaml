  bottom of competitive 8B range per artificialanalysis.ai (top-10 <80B: 40–75%,
  typical 8B: 18–40%). score=0 expected for Qwen3-8B-FP8 in standard mode.
  Generative scoring — works with standard lighteval image.
category: code
tags: [coding, competitive-programming, execution, contamination-free, lighteval]

benchmarks:
